services:
  review-api:
    build:
      context: ./services/review-api
    container_name: portfolio-review-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      # Use REVIEW_API_BIND_IP=10.10.30.10 when cloudflared runs in Docker.
      - "${REVIEW_API_BIND_IP:-127.0.0.1}:${REVIEW_API_PORT:-9000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  site-deployer:
    build:
      context: ./services/site-deployer
    container_name: portfolio-site-deployer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-master}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-Pablo-ArgF/Portfolio}
      PUBLIC_REVIEW_API_URL: ${PUBLIC_REVIEW_API_URL:-https://landing.pabloaf.com}
    ports:
      # Cloudflare routes webhooks.pabloaf.com here.
      - "${DEPLOY_WEBHOOK_BIND_IP:-127.0.0.1}:${DEPLOY_WEBHOOK_PORT:-9001}:3000"
    volumes:
      - portfolio-site:/site
    tmpfs:
      - /work
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portfolio-site:
    build:
      context: ./services/site
    container_name: portfolio-site
    restart: unless-stopped
    ports:
      # Route pabloaf.com to this port only if replacing the old site origin.
      - "${SITE_BIND_IP:-127.0.0.1}:${SITE_PORT:-8081}:80"
    volumes:
      - portfolio-site:/usr/share/nginx/html:ro
    depends_on:
      site-deployer:
        condition: service_started

volumes:
  portfolio-site:
